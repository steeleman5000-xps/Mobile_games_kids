<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlotte's Game Hub 🎮</title>
  <link rel="stylesheet" href="css/shared.css" />
  <style>
    body { justify-content: flex-start; padding-top: 32px; }

    .hero { text-align: center; margin-bottom: 28px; }
    .hero h1 { font-size: 2.6rem; color: #fff; text-shadow: 2px 2px 6px rgba(0,0,0,0.3); }
    .hero p  { color: rgba(255,255,255,0.85); font-size: 1.05rem; margin-top: 6px; }

    #game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }

    .game-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      cursor: pointer;
      padding: 24px 16px;
      text-align: center;
      text-decoration: none;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .game-card:hover  { box-shadow: 0 16px 40px rgba(0,0,0,0.22); transform: translateY(-4px); }
    .game-card:active { transform: translateY(-1px); }

    .game-card .emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
    .game-card h2    { color: #333; font-size: 1.2rem; margin-bottom: 6px; }
    .game-card p     { color: #888; font-size: 0.85rem; line-height: 1.4; }

    footer {
      color: rgba(255,255,255,0.5);
      font-size: 0.75rem;
      margin-top: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🎮 Charlotte's Game Hub</h1>
    <p>Pick a game and have fun!</p>
  </div>

  <div id="game-grid"></div>

  <footer>Tap a card to play &bull; More games coming soon!</footer>

  <script>
    // ── To add a new game: add one entry here and create games/<file>.html ──
    const GAMES = [
      {
        emoji: "🎈",
        title: "Hangman",
        desc:  "Guess the secret word letter by letter!",
        url:   "games/hangman.html",
      },
      {
        emoji: "⭕",
        title: "Tic Tac Toe",
        desc:  "X's and O's — play against a friend or the computer!",
        url:   "games/tictactoe.html",
      },
      {
        emoji: "🐍",
        title: "Snake",
        desc:  "Eat the food, grow the snake, don't crash!",
        url:   "games/snake.html",
      },
      {
        emoji: "🃏",
        title: "Level 8",
        desc:  "Card game — beat the computer through 8 phases!",
        url:   "games/level8.html",
      },
      {
        emoji: "🏠",
        title: "Game of Life",
        desc:  "Spin the wheel, live your life, retire rich!",
        url:   "games/life.html",
      },
    ];

    const grid = document.getElementById("game-grid");
    GAMES.forEach(({ emoji, title, desc, url }) => {
      const a = document.createElement("a");
      a.className = "game-card";
      a.href = url;
      a.innerHTML = `<span class="emoji">${emoji}</span><h2>${title}</h2><p>${desc}</p>`;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
